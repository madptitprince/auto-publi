services:
  bchef-auto-publi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bchef-auto-publi
    restart: unless-stopped
    shm_size: '512m'
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
      - ./assets:/app/assets
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bchef-montage-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bchef-montage-studio
    command: ["uvicorn", "montage_auto.app:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
    volumes:
      - ./montage_auto:/app/montage_auto
      - ./assets:/app/assets
      - ./uploads:/app/uploads
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
