<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <title>Connexion - BCHEF Bourges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(255, 85, 0, 0.08) 0%, #080a0f 70%);
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg), 0 0 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--brand-orange) 0%, #d44000 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      padding: 0.6rem 1.4rem;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 16px var(--brand-orange-glow);
      margin-bottom: 1.25rem;
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .alert-banner {
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .alert-error {
      background: var(--status-rose-dim);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .alert-success {
      background: var(--status-emerald-dim);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-input {
      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px var(--brand-orange-dim);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
    }

    .btn-toggle-pwd:hover {
      color: var(--text-secondary);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--brand-orange) 0%, #e04b00 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.95rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      margin-top: 0.75rem;
      box-shadow: 0 4px 16px var(--brand-orange-glow);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), filter var(--transition-fast);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--brand-orange-glow);
      filter: brightness(1.08);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .login-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">BCHEF</div>
        <h1 class="login-title">ESPACE ADMINISTRATION</h1>
        <p class="login-subtitle">Bourges &bull; Automatisation Reseaux Sociaux</p>
      </div>

      {% if error %}
      <div class="alert-banner alert-error" role="alert">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Identifiant ou mot de passe incorrect.</span>
      </div>
      {% endif %}

      {% if message == 'logged_out' %}
      <div class="alert-banner alert-success" role="alert">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>Vous avez ete deconnecte avec succes.</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" autocomplete="on">
        <input type="hidden" name="next" value="{{ next or '/' }}">

        <div class="form-group">
          <label class="form-label" for="username">Identifiant</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="admin"
              required
              autofocus
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              class="btn-toggle-pwd"
              id="toggle-pwd-btn"
              title="Afficher/Masquer le mot de passe"
              onclick="togglePasswordVisibility()"
            >
              <svg id="eye-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          Connexion au Dashboard
        </button>
      </form>

      <div class="login-footer">
        Acces securise &bull; Restauration & Reseaux Sociaux
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("password");
      if (!pwdInput) return;
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
      } else {
        pwdInput.type = "password";
      }
    }
  </script>
</body>
</html>
