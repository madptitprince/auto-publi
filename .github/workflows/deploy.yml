name: CI/CD Pipeline - BCHEF Bourges Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax & compilation
        run: |
          python -m py_compile $(find src scripts -name "*.py")

  deploy:
    name: Deploy to Production (Oracle Cloud VPS)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: VPS_SSH_KEY
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SECRET_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SECRET_TEST: ${{ secrets.TEST }}
          SECRET_SSH_KEY: ${{ secrets.SSH_KEY }}
          SECRET_ID_ED25519: ${{ secrets.ID_ED25519 }}
        run: |
          # Pick whichever secret has content
          VPS_SSH_KEY="${SECRET_VPS_SSH_KEY:-${SECRET_TEST:-${SECRET_SSH_KEY:-${SECRET_ID_ED25519}}}}"
          HOST="${VPS_HOST:-158.178.198.34}"
          USER="${VPS_USER:-ubuntu}"

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERREUR: Le secret SSH n'a pas ete detecte par GitHub Actions."
            echo "Assurez-vous d'avoir cree un 'Repository Secret' (et non un 'Environment Secret') nomme 'VPS_SSH_KEY'."
            exit 1
          fi

          echo "Secret detecte avec succes (longueur: ${#VPS_SSH_KEY} caracteres)."

          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          echo "Connexion au VPS $USER@$HOST et mise a jour..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$USER@$HOST" "bash -s" << 'EOF'
            set -e
            cd ~/auto-publi
            echo "[1/3] Recuperation des derniers commits..."
            git fetch origin main
            git reset --hard origin/main
            echo "[2/3] Reconstruction et redemarrage des conteneurs Docker..."
            sudo docker compose down || true
            sudo docker compose up -d --build
            echo "[3/3] Verification de l'etat du conteneur..."
            sleep 5
            sudo docker compose ps
            curl -s http://localhost:8000/api/status || true
          EOF
          echo "Deploiement effectue avec succes !"
